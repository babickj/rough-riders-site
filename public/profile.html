<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Player profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
.pf{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;display:flex;flex-direction:column;gap:22px}
.pf-head{background:var(--band);color:var(--band-fg);border-bottom:4px solid var(--red)}
.pf-head .pf{padding-block:22px;flex-direction:row;flex-wrap:wrap;gap:18px;align-items:flex-end}
.pf-num{font-family:var(--f-head);font-weight:800;font-size:64px;line-height:.9;color:var(--red)}
.pf-name{font-family:var(--f-head);font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin:0}
.pf-sub{color:#D0D0D4;font-size:15px;margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);padding:10px 12px}
.fact span{display:block;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted)}
.fact b{font-family:var(--f-head);font-size:22px;font-weight:800}
.media{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.media iframe,.media video,.media img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain}
.bio{font-size:16px;max-width:68ch;white-space:pre-wrap}
.contact{background:var(--soft);border-left:4px solid var(--red);padding:12px 14px}
.contact .em{font-weight:700;user-select:all}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.foot{font-size:12px;color:var(--muted)}
@media print{
  .actions{display:none!important}
  .pf-head{background:#fff;color:#111;border-bottom:3px solid #111}
  .pf-sub{color:#333}
  .media{display:none}
  body{background:#fff}
  @page{margin:.5in}
}
</style>
</head>
<body>
<header class="pf-head"><div class="pf">
  <div class="pf-num" id="pf-num"></div>
  <div><h1 class="pf-name" id="pf-name">Loading…</h1><div class="pf-sub" id="pf-sub"></div></div>
</div></header>
<main class="pf" id="pf-main">
  <p class="note" id="pf-msg">Loading the profile…</p>
</main>
<script src="/profile.js"></script>
</body>
</html>
